<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F5EBD6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="SYNAPSE Paper Theater · 纸片剧场 · 一款让你哈哈大笑、潸然泪下、魂牵梦绕的 AI 原生情感剧场" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>🎭 SYNAPSE · 纸片剧场</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body, #root { height: 100%; margin: 0; padding: 0; }
      html { background: #1a1823; overscroll-behavior: none; }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
      }
      /* Initial loading paper */
      #initial-loader {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background:
          radial-gradient(ellipse at center, #F5EBD6 0%, #E2C88D 70%, #8B4513 100%);
        color: #5E2F0D;
        font-family: 'Cormorant Garamond', serif;
        font-size: 22px;
        letter-spacing: 0.1em;
        z-index: 9999;
        transition: opacity 0.6s ease;
      }
      #initial-loader.fade { opacity: 0; pointer-events: none; }
      .loader-seal {
        width: 56px; height: 56px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #D94040, #8B1A1A 70%, #5C0F0F);
        box-shadow: 0 2px 8px rgba(0,0,0,0.3), inset 0 -4px 6px rgba(0,0,0,0.3);
        margin-right: 16px;
        animation: spin 2.2s ease-in-out infinite;
      }
      @keyframes spin {
        0%, 100% { transform: rotate(0) scale(1); }
        50% { transform: rotate(180deg) scale(1.1); }
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="loader-seal"></div>
      <div>翻开羊皮纸&hellip;</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
